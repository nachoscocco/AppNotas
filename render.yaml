services:
  - type: web
    name: appnotas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_SENDER_NAME
        value: "Mi Cuaderno de Notas"
      - key: MAIL_USERNAME
        value: urielagustinrossi@gmail.com
      - key: MAIL_PASSWORD
        sync: false
